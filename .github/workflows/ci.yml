name: Community site checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:worker

  deploy:
    # Every push to main goes straight to the custom domain in wrangler.jsonc.
    # Apply any pending Supabase migration before merging: the gallery, detail
    # pages and /review query columns the database has to already have.
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://designstudioforfastled.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Both values are inlined into the bundle at build time, so a build that
      # runs without them ships a site with Supabase silently switched off —
      # empty gallery, broken sign-in, no error anywhere. Fail loudly instead.
      # They are repository variables, not secrets: the URL and the publishable
      # key are public values that end up in the bundle, and masking a value
      # anyone can read from the site only makes the build log harder to debug.
      - name: Check the Supabase build inputs are present
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            echo "Missing repository variable(s):$missing"
            echo "Set them under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      # NEXT_PUBLIC_SITE_URL is not passed here on purpose — it comes from the
      # committed .env.production, which is the whole point of that file.
      - name: Build the Worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:worker

      # Deploys the .open-next output from the step above; wrangler reads the
      # credentials from the environment.
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy
